<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherNow</title>
  <link rel="stylesheet" href="./public/index.css" />
</head>
<body>
  <main class="page">
    <section class="weather-card">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon">☁️</span>
          <div>
            <h1>WeatherNow</h1>
            <p class="subtitle">Fast weather search with OpenWeatherMap</p>
          </div>
        </div>
        <div class="meta">
          <span>Secure</span>
          <span>API key hidden</span>
        </div>
      </header>

      <section class="search-panel">
        <label class="search-label" for="cityInput">City name</label>
        <div class="search-row">
          <input id="cityInput" type="text" placeholder="e.g. London" autocomplete="off" />
          <button id="searchBtn">Search</button>
        </div>
        <p class="hint">Type a city and press Enter or click Search.</p>
      </section>

      <div id="message" class="message"></div>

      <section id="resultCard" class="result-card hidden">
        <div class="weather-header">
          <div class="weather-icon" id="weatherIcon">☀️</div>
          <div>
            <p class="city-name" id="cityName"></p>
            <p class="weather-desc" id="weatherDesc"></p>
          </div>
        </div>

        <div class="temperature-block">
          <span id="temperature"></span>
          <small>Feels like <span id="feelsLike"></span></small>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <span>Humidity</span>
            <strong id="humidity"></strong>
          </div>
          <div class="stat-card">
            <span>Wind</span>
            <strong id="windSpeed"></strong>
          </div>
          <div class="stat-card">
            <span>Pressure</span>
            <strong id="pressure"></strong>
          </div>
          <div class="stat-card">
            <span>Condition</span>
            <strong id="condition"></strong>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="./public/index.js"></script>
</body>
</html>
